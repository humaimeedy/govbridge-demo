/* Layout: welcome page → login → role choice → role workspace (work area beside an "under the hood" code panel).
   Palette follows ICAIRE's site tokens: midnight, forest, lime, gold. */
:root {
  --bg: #f4f7f5; --surface: #ffffff; --surface-2: #eef3f0; --ink: #16242d; --muted: #4a5a63; --faint: #667079;
  --line: #e2e8e5; --line-strong: #c3cec8;
  --brand: #1c5631; --brand-ink: #ffffff; --midnight: #0f2a38; --lime: #8dc63f; --lime-soft: #eef6e4; --gold: #d8a23a; --info: #2c6e8f;
  --ok: #1c5631; --ok-soft: #e3eee6; --bad: #b03a2e; --bad-soft: #f7e5e2; --warn-soft: #fbf1dc;
  --m-binding: #0f2a38; --m-cert: #b07d1c; --m-vol: #2c6e8f; --m-eth: #1c5631;
  --mod-ink: #ffffff; --code-bg: #0f2a38; --code-ink: #e6eeea; --code-com: #7f98a3; --code-str: #e8c77a; --code-name: #8fd3e8; --code-kw: #a4d65e;
  --font-body: "IBM Plex Sans", Calibri, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1c25; --surface: #11283a; --surface-2: #163246; --ink: #e6eeea; --muted: #b0c0c8; --faint: #8fa2ad;
  --line: #21405a; --line-strong: #2f5670;
  --brand: #8dc63f; --brand-ink: #0f2a38; --midnight: #e6eeea; --lime: #8dc63f; --lime-soft: #1d3a2a; --gold: #e0b45a; --info: #7fb8d4;
  --ok: #8dc63f; --ok-soft: #173826; --bad: #f08a7e; --bad-soft: #3a1f1f; --warn-soft: #3a3020;
  --m-binding: #9cc3d5; --m-cert: #e0b45a; --m-vol: #7fb8d4; --m-eth: #8dc63f;
  --mod-ink: #0b1c25; --code-bg: #071620; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1c25; --surface: #11283a; --surface-2: #163246; --ink: #e6eeea; --muted: #b0c0c8; --faint: #8fa2ad;
  --line: #21405a; --line-strong: #2f5670;
  --brand: #8dc63f; --brand-ink: #0f2a38; --midnight: #e6eeea; --lime: #8dc63f; --lime-soft: #1d3a2a; --gold: #e0b45a; --info: #7fb8d4;
  --ok: #8dc63f; --ok-soft: #173826; --bad: #f08a7e; --bad-soft: #3a1f1f; --warn-soft: #3a3020;
  --m-binding: #9cc3d5; --m-cert: #e0b45a; --m-vol: #7fb8d4; --m-eth: #8dc63f;
  --mod-ink: #0b1c25; --code-bg: #071620; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.22; }
p { margin: 0; }
button, input, select, textarea { font: inherit; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1360px; margin: 0 auto; }
.narrow { max-width: 1120px; margin: 0 auto; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); }
.lead { color: var(--muted); }

/* ---------- app bar (fixed dark look in both themes) */
.appbar { background: #0f2a38; color: #fff; padding-block: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.appbar .inner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: #fff; background: none; border: 0; padding: 0; cursor: pointer; }
.mark svg { width: 34px; height: 22px; }
.appbar .tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid #3d6a5a; color: #c9d6cf; }
.appbar .tag.lime { background: #8dc63f; color: #0f2a38; border-color: #8dc63f; font-weight: 600; }
.appbar .spacer { flex: 1; }
.appbar .who { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #e6eeea; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #8dc63f; color: #0f2a38; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.abtn { background: transparent; color: #fff; border: 1px solid #3d6a5a; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.abtn:hover { border-color: #8dc63f; }
.abtn.lime { background: #8dc63f; color: #0f2a38; border-color: #8dc63f; font-weight: 600; }

.hero .narrow { display: flex; flex-direction: column; gap: 18px; }
.hero .eyebrow { color: #8dc63f; }
.hero h1 { font-size: clamp(32px, 4.6vw, 52px); max-width: 15ch; letter-spacing: -.01em; }
.hero p.lead { color: #c9d6cf; font-size: 18px; max-width: 54ch; }
.hero .ctas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.hero .badge { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: #c9d6cf; border: 1px solid #3d6a5a; border-radius: 999px; padding: 5px 12px; align-self: flex-start; background: rgba(15, 42, 56, .6); }
.hero .badge i { width: 8px; height: 8px; border-radius: 50%; background: #8dc63f; }
.big { font-size: 16px; padding: 11px 20px; border-radius: 10px; }
.sec { padding-block: 56px; }
.sec + .sec { padding-top: 0; }
.sec h2 { font-size: clamp(24px, 3vw, 32px); }
.sec .intro { display: flex; flex-direction: column; gap: 10px; max-width: 70ch; margin-bottom: 26px; }
.sec .intro p { color: var(--muted); font-size: 16.5px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.pcard .k { font-size: 12px; font-weight: 600; color: var(--faint); letter-spacing: .08em; text-transform: uppercase; }
.pcard h3 { font-size: 18px; }
.pcard p { color: var(--muted); }
.example { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 18px; align-items: center; }
.example .num { font-size: 40px; font-weight: 700; color: var(--brand); line-height: 1; font-variant-numeric: tabular-nums; }
.example .srcs { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 1 / -1; }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; counter-reset: f; }
.flow > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; position: relative; }
.flow > div::before { counter-increment: f; content: counter(f); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 14px; margin-bottom: 10px; }
.flow > div:not(:last-child)::after { content: "→"; position: absolute; right: -11px; top: 22px; color: var(--brand); font-weight: 700; }
.flow h3 { font-size: 16px; margin-bottom: 4px; }
.flow p { color: var(--muted); font-size: 14px; }
.flow .tech { margin-top: 8px; }
@media (max-width: 860px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } .flow > div::after { display: none; } }
@media (max-width: 480px) { .flow { grid-template-columns: minmax(0, 1fr); } }
.why { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.why div { border-left: 3px solid var(--lime); padding: 4px 0 4px 16px; }
.why h3 { font-size: 17px; margin-bottom: 4px; }
.why p { color: var(--muted); }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.rcard .ico { width: 46px; height: 46px; border-radius: 12px; background: var(--midnight); display: grid; place-items: center; }
.rcard .ico svg { width: 26px; height: 26px; }
.rcard h3 { font-size: 19px; }
.rcard ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14.5px; display: flex; flex-direction: column; gap: 3px; }
.rcard .btn { margin-top: auto; align-self: flex-start; }
.ctaband { background: #0f2a38; color: #fff; border-radius: 14px; padding: 28px; display: flex; gap: 16px 28px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ctaband h2 { font-size: 24px; }
.ctaband p { color: #c9d6cf; margin-top: 6px; }

/* ---------- auth */
.authwrap { min-height: min(70vh, 640px); display: grid; place-items: center; padding-block: 48px; }
.auth { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.auth h1 { font-size: 26px; }
.auth label { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.auth input { border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; background: var(--surface); color: var(--ink); font-weight: 400; font-size: 15px; }
.auth .hint { font-size: 13px; background: var(--lime-soft); border-radius: 8px; padding: 10px 12px; color: var(--ink); }
.rolewrap { padding-block: 40px 56px; display: flex; flex-direction: column; gap: 22px; }
.rolewrap h1 { font-size: clamp(26px, 3.2vw, 34px); }

/* ---------- workspace */
.scenario { padding-block: 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.scenario .inner { display: flex; gap: 12px 28px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.scenario p { margin-top: 4px; color: var(--muted); max-width: 78ch; }
.scenario .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs-wrap { padding-block: 16px 0; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.tab { flex: 1 0 200px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; color: var(--ink); display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; }
.tab .n { grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--surface-2); color: var(--muted); }
.tab .t { font-weight: 600; font-size: 14px; line-height: 1.2; }
.tab .tier { justify-self: start; }
.tab[aria-selected="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
.tab[aria-selected="true"] .n { background: var(--brand); color: var(--brand-ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.tier-free { background: var(--lime); color: #0f2a38; }
.tier-paid { background: var(--ok-soft); color: var(--ok); }
.tier-higher { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
.tier-highest { background: color-mix(in srgb, var(--midnight) 14%, transparent); color: var(--midnight); }
.tier-none { background: var(--surface-2); color: var(--muted); }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.main { padding-block: 16px 28px; }
.main .inner { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 20px; align-items: start; }
.main.hood-closed .inner { grid-template-columns: minmax(0, 1fr); }
.main.hood-closed .hood { display: none; }
@media (max-width: 1080px) { .main .inner { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.work { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.head h2 { font-size: 22px; }
.head p { margin-top: 6px; color: var(--muted); max-width: 70ch; }

      '<div class="field full"><label class="lbl" for="pf-title">Requirement title</label><input type="text" id="pf-title" value="' + esc(F.title) + '"></div>' +
      '<div class="field full"><label class="lbl" for="pf-stmt">Requirement statement</label><textarea id="pf-stmt">' + esc(F.statement) + "</textarea></div>" +
      '<div class="field"><span class="lbl">Record type</span><span class="chip">Harmonised requirement</span></div>' +
      '<div class="field"><span class="lbl">Action required</span>' + seg(F, "act", [["1", "Assess"], ["0", "Not stated"]], "pf") + "</div>" +
      '<div class="field"><span class="lbl">Source provision</span>' + seg(F, "src", [["1", "EU AI Act Art. 10(2)(f)"], ["0", "None yet"]], "pf") + "</div>" +
      '<div class="field"><span class="lbl">Evidence expected</span>' + seg(F, "evd", [["1", "Bias examination report"], ["0", "Not stated"]], "pf") + "</div></div></div>";
    h += '<div class="panel"><div class="head"><div><div class="eyebrow">Live validation · SHACL</div><h2>' + (chk.conforms ? "Ready to submit" : "Fix before submitting") + "</h2></div>" + (chk.conforms ? '<span class="status ok">Conforms</span>' : '<span class="status bad">' + chk.results.length + " issue" + (chk.results.length > 1 ? "s" : "") + "</span>") + "</div>" +
      (chk.conforms ? '<p class="lead" style="margin-top:8px">The draft cites EU AI Act Art. 10(2)(f), which asks providers of high-risk AI to examine data for possible biases, and names its evidence.</p>' : '<ul class="msgs">' + chk.results.map((x) => "<li>" + esc(x.message) + "</li>").join("") + "</ul>") +
      '<div style="margin-top:14px"><button class="btn primary" type="button" id="pf-submit"' + (chk.conforms ? "" : " disabled") + ">Submit for expert review</button></div></div>";
    h += '<div class="note"><b>Fair process.</b> After submission, specialist reviewers check the source, scope and interpretation. Eligible policymakers then vote. Your institution\'s subscription has no effect on the outcome.</div>';
    $("work").innerHTML = h;
    hood("This is the OWL vs SHACL point in practice. OWL alone would accept an incomplete draft and assume its source is simply unknown. SHACL checks the data as submitted and rejects it.", [block("SHACL shape: every requirement", D.wellformed.shapes.split("\n\n")[0]), block("Your draft (Turtle)", chk.ttl), block("Validation report", report(chk))]);
  }
  function submitProposal() {
    S.store.proposals.unshift({ id: "P-007", type: "harmonised", title: S.form.title.trim() || "Bias testing before deployment", statement: S.form.statement.trim(), by: "Demo University", submitted: TODAY, status: "awaiting",
      review: ["Source cited accurately: EU AI Act Art. 10(2)(f)", "Applicability recorded: providers of high-risk AI in EU scope", "Evidence type defined: bias examination report", "Suggestion: consider a link to ISO/IEC 42001 cl. 6.1.4 impact assessment"],
      votes: [["Policy team A", "approve", "Clear source and evidence"], ["Regulator B", "approve", "Supports non-discrimination"], ["Ministry C", "reject", "Would like an ISO link first"]] });
    S.vote.pid = "P-007"; save();
  }
  function rEvaluate() {
    const E = S.evalForm;
    let h = head("Contribution", "Evaluate an existing rule", "Tell the Assembly how a published requirement works in practice. Evaluations inform future amendments; they do not change the rule by themselves.", ["Institution", "tier-none"]) + "</div>";
    h += '<div class="panel"><div class="form"><div class="field full"><span class="lbl">Requirement</span><div class="picker">' + RIDS().map((x) => '<button type="button" data-ef="rid" data-v="' + x + '" aria-pressed="' + (E.rid === x) + '">' + x.replace("GB-R-", "") + " · " + esc(REQ(x).label) + "</button>").join("") + "</div></div>" +
      [["clarity", "Clarity"], ["burden", "Implementation burden"], ["effect", "Effectiveness"]].map(([f, l]) => '<div class="field"><span class="lbl">' + l + " (1 = low, 5 = high)</span>" + seg(E, f, [1, 2, 3, 4, 5].map((n) => [String(n), String(n)]), "ef") + "</div>").join("") +
      '<div class="field full"><label class="lbl" for="ef-text">Evidence from practice</label><textarea id="ef-text">' + esc(E.text) + '</textarea></div></div><div style="margin-top:14px"><button class="btn primary" type="button" id="ef-submit">Submit evaluation</button></div></div>';
    const mine = S.store.evaluations;
    if (mine.length) h += '<div class="panel"><div class="eyebrow">Submitted evaluations</div><div class="rows" style="margin-top:10px">' + mine.map((e) => '<div class="arow"><div class="top"><h3><span class="id">' + e.rid + "</span> " + esc(REQ(e.rid).label) + '</h3><span class="status wait">With the Assembly</span></div><p>Clarity ' + e.clarity + " · Burden " + e.burden + " · Effectiveness " + e.effect + " · " + esc(e.date) + "</p></div>").join("") + "</div></div>";
    $("work").innerHTML = h;
    hood("An evaluation is stored as its own record, linked to the requirement it evaluates. It is evidence for future amendments, not a change to the rule.", [block("Evaluation record (Turtle)", evalTtl(E))]);
  }
  const evalTtl = (E) => PREFIX + '\n\ngbo:Eval-' + E.rid + "-DemoUniversity a gbo:RuleEvaluation ;\n    gbo:evaluates gbo:" + E.rid + " ;\n    gbo:submittedBy gbo:DemoUniversity ;\n    gbo:clarity " + E.clarity + " ;\n    gbo:implementationBurden " + E.burden + " ;\n    gbo:effectiveness " + E.effect + ' ;\n    gbo:comment "' + String(E.text).replace(/"/g, "'") + '" .\n';
  function statusPill(p) { return p.status === "awaiting" ? '<span class="status wait">Awaiting Assembly vote</span>' : p.status === "approved" ? '<span class="status ok">Approved</span>' : '<span class="status bad">' + esc(outcomeLabel(p)) + "</span>"; }
  function rMine() {
    const mine = myProposal(), evals = S.store.evaluations;
    let h = head("Tracking", "My contributions", "Every proposal and evaluation from your institution, with its current stage.", ["Institution", "tier-none"]) + "</div>";
    if (!mine && !evals.length) h += '<div class="panel"><p class="lead">No contributions yet. Start with a proposal.</p><div style="margin-top:12px"><button class="btn primary" type="button" data-tab="propose">Propose a requirement</button></div></div>';
    if (mine) {
      const dec = S.store.decisions.find((d) => d.pid === "P-007");
      h += '<div class="panel"><div class="head"><div><span class="id">P-007 · GB-R-DRAFT-007</span><h2>' + esc(mine.title) + "</h2><p>" + esc(mine.statement) + "</p></div>" + statusPill(mine) + "</div>" + timeline(mine) +
        '<div class="two" style="margin-top:14px"><div class="box"><h4>Expert review (simulated)</h4><ul>' + mine.review.map((r) => "<li>" + esc(r) + "</li>").join("") + '</ul></div><div class="box"><h4>Outcome</h4><ul>' +
        (dec ? "<li>" + esc(dec.effect) + "</li><li>Votes: " + dec.tally + "</li>" : "<li>Waiting for the Assembly. Switch to the policymaker role to vote.</li>") + "</ul></div></div></div>";
    }
    if (evals.length) h += '<div class="panel"><div class="eyebrow">Evaluations</div><div class="rows" style="margin-top:10px">' + evals.map((e) => '<div class="arow"><div class="top"><h3><span class="id">' + e.rid + "</span> " + esc(REQ(e.rid).label) + '</h3><span class="status wait">With the Assembly</span></div><p>' + esc(e.text) + "</p></div>").join("") + "</div></div>";
    $("work").innerHTML = h;
    hood("Contributions are records in GovBridge-O, each linked to the institution that made it and to the decision that followed.", [block("Contribution log (Turtle)", PREFIX + "\n\n" + (mine ? "gbo:P-007 a gbo:Proposal ;\n    gbo:proposes gbo:GB-R-DRAFT-007 ;\n    gbo:submittedBy gbo:DemoUniversity ;\n    gbo:status gbo:" + ({ awaiting: "AwaitingVote", approved: "Approved", returned: "ReturnedForRevision" }[mine.status] || "AwaitingVote") + " .\n" : "# no proposals yet\n") + evals.map((e) => "gbo:Eval-" + e.rid + "-DemoUniversity a gbo:RuleEvaluation ; gbo:evaluates gbo:" + e.rid + " .").join("\n"))]);
  }

  // =====================================================================  POLICYMAKER
  const RULE_TXT = { harmonised: "Harmonised requirement · expert validation, then an Assembly vote decides whether it enters the next release.", rule: "Proposal for a new rule · the Assembly may endorse it as a recommendation; adoption stays with the issuing authority." };
  function tallyOf(p, mine) {
    const v = p.votes.map((x) => x[1]).concat(mine ? [mine] : []);
    return { approve: v.filter((x) => x === "approve").length, reject: v.filter((x) => x === "reject").length, abstain: v.filter((x) => x === "abstain").length };
  }
  function rQueue() {
    const queue = S.store.proposals.filter((p) => p.status === "awaiting");
    if (queue.length && !queue.some((p) => p.id === S.vote.pid)) S.vote.pid = queue[0].id;
    let h = head("Assembly", "Voting queue", "Proposals that passed the SHACL check and expert review. Read the review, declare any conflict of interest, then cast your vote with a reason.", ["Eligible member", "tier-none"]) + "</div>";
    if (!queue.length) {
      h += '<div class="panel"><p class="lead">The queue is empty. All proposals have been decided. See Decisions and releases.</p>' + (myProposal() ? "" : '<p class="lead" style="margin-top:8px">Tip: switch to the institutional proposer role and submit a proposal; it will appear here.</p>') + "</div>";
      $("work").innerHTML = h; hood("Decisions are stored as records linked to the proposal and the release they affect.", [block("Decision rule (demo)", "# A proposal is approved when approvals outnumber rejections.\n# Abstentions are recorded but not counted.\n# Real thresholds and quorum are to be defined by the Assembly.")]); return;
    }
    h += '<div class="rows">' + queue.map((p) => '<div class="arow' + (p.id === S.vote.pid ? " sel" : "") + '" data-prop="' + p.id + '"><div class="top"><h3><span class="id">' + p.id + "</span> " + esc(p.title) + "</h3>" + (p.id === "P-007" ? '<span class="status new">New from Demo University</span>' : '<span class="status wait">Awaiting vote</span>') + "</div><p>" + esc(p.by) + " · submitted " + esc(p.submitted) + "</p></div>").join("") + "</div>";
    const p = queue.find((x) => x.id === S.vote.pid), V = S.vote, t = tallyOf(p);
    h += '<div class="panel"><div class="head"><div><span class="id">' + p.id + "</span><h2>" + esc(p.title) + "</h2><p>" + esc(p.statement) + '</p></div><span class="chip">' + (p.type === "harmonised" ? "Harmonised requirement" : "Proposal for a new rule") + "</span></div>" +
      '<p class="lead" style="margin-top:10px;font-size:13.5px">' + esc(RULE_TXT[p.type]) + "</p>" +
      '<div class="two" style="margin-top:12px"><div class="box"><h4>Expert review (simulated)</h4><ul>' + p.review.map((r) => "<li>" + esc(r) + "</li>").join("") + '</ul></div><div class="box"><h4>Votes so far (simulated members)</h4><div class="votes">' + p.votes.map(([w, v, r]) => '<div class="vote"><span>' + esc(w) + '</span><span class="status ' + (v === "approve" ? "ok" : v === "reject" ? "bad" : "na") + '">' + v + "</span><small>" + esc(r) + "</small></div>").join("") + "</div></div></div>" +
      '<div class="form" style="margin-top:16px"><div class="field full"><label class="check"><input type="checkbox" id="v-coi"' + (V.coi ? " checked" : "") + "> I declare that I have no conflict of interest with the proposer.</label></div>" +
      '<div class="field"><span class="lbl">Your vote</span>' + seg(V, "choice", [["approve", "Approve"], ["reject", "Reject"], ["abstain", "Abstain"]], "vt") + "</div>" +
      '<div class="field full"><label class="lbl" for="v-reason">Reason (published with the decision)</label><textarea id="v-reason" placeholder="Why do you vote this way?">' + esc(V.reason) + "</textarea></div></div>" +
      '<div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" type="button" id="v-cast"' + (V.coi && V.choice && V.reason.trim().length >= 8 ? "" : " disabled") + '>Cast vote</button><span class="lead" style="font-size:13px">Needs a declaration, a choice and a reason of at least a few words.</span></div>' +
      '<div class="tally"><span class="status ok">' + t.approve + ' approve</span><span class="status bad">' + t.reject + ' reject</span><span class="status na">' + t.abstain + " abstain</span></div></div>";
    $("work").innerHTML = h;
    hood("Before a vote is possible, the proposal has passed SHACL validation and expert review. Your vote becomes part of a published decision record.", [
      block("Proposal under vote (Turtle)", p.id === "P-007" ? D.proposalChecks["111"].ttl : PREFIX + '\n\ngbo:P-008 a gbo:Proposal ;\n    gbo:recordType gbo:NewRuleProposal ;\n    rdfs:label "' + p.title + '" ;\n    gbo:submittedBy gbo:DemoInstituteForPublicPolicy ;\n    gbo:relatedTo gbo:GB-R-005 .\n'),
      block("Decision rule (demo)", "# A proposal is approved when approvals outnumber rejections.\n# Abstentions are recorded but not counted.\n# Real thresholds and quorum are to be defined by the Assembly."),
    ]);
  }
  function castVote() {
    const V = S.vote, p = S.store.proposals.find((x) => x.id === V.pid); const t = tallyOf(p, V.choice);
    const approved = t.approve > t.reject;
    p.status = approved ? "approved" : "returned";
    p.votes.push([S.name + " (you)", V.choice, V.reason.trim()]);
    let effect;
    if (p.type === "harmonised") { if (approved) { S.store.release = "0.4"; effect = "Published as GB-R-007 in GovBridge-O release 0.4. It now appears in requirement enquiries and guidance."; } else effect = "Returned to the proposer for revision. No release change."; }
    else effect = approved ? "Published as a recommendation to the relevant issuing authority. No law changes." : "Not endorsed. The proposer can revise and resubmit.";
    S.store.decisions.unshift({ pid: p.id, title: p.title, type: p.type, outcome: approved ? "Approved" : "Not approved", tally: t.approve + " approve · " + t.reject + " reject · " + t.abstain + " abstain", reason: V.reason.trim(), date: TODAY, effect });
    S.vote = { pid: "", choice: "", reason: "", coi: false }; save();
  }
  function rRecords() {
    const groups = {}; Object.entries(D.provisions).forEach(([pid, pv]) => (groups[pv.instrument] = groups[pv.instrument] || []).push(pid));
    const pv = D.provisions[S.recSel];
    let h = head("Review", "How GovBridge records existing rules", "Source requirements come from law or standards, so they are not voted on. If GovBridge represents one inaccurately, report it and specialist reviewers will correct the record.", ["Eligible member", "tier-none"]) + "</div>";
    h += '<div class="panel"><div class="rows">' + Object.entries(groups).map(([inst, pids]) => '<div><div class="eyebrow" style="margin:6px 0">' + esc(D.instruments[inst].label) + ' · <span class="mod m-' + D.instruments[inst].modality + '">' + MOD_SHORT[D.instruments[inst].modality] + '</span></div><div class="picker">' + pids.map((p) => '<button type="button" data-rec="' + p + '" aria-pressed="' + (S.recSel === p) + '">' + esc(D.provisions[p].ref) + "</button>").join("") + "</div></div>").join("") + "</div></div>";
    h += '<div class="panel"><div class="head"><div><span class="id">' + S.recSel + "</span><h2>" + esc(INST_SHORT[pv.instrument]) + " " + esc(pv.ref) + "</h2><p>" + esc(pv.summary) + '</p></div><span class="chip">Source requirement · no vote</span></div>' +
      '<p class="lead" style="margin-top:10px;font-size:13.5px">Applies when: ' + pv.conds.map((c) => esc(D.conditions[c])).join("; ") + ".</p>" +
      '<div class="form" style="margin-top:12px"><div class="field full"><label class="lbl" for="rep-text">Report an inaccuracy in this record</label><textarea id="rep-text" placeholder="What does GovBridge get wrong about this provision?">' + esc(S.report) + '</textarea></div></div><div style="margin-top:10px"><button class="btn primary" type="button" id="rep-submit"' + (S.report.trim().length >= 8 ? "" : " disabled") + ">Send to specialist reviewers</button></div></div>";
    const reps = S.store.reports;
    if (reps.length) h += '<div class="panel"><div class="eyebrow">Your reports</div><div class="rows" style="margin-top:10px">' + reps.map((r) => '<div class="arow"><div class="top"><h3><span class="id">' + r.pid + "</span> " + esc(r.ref) + '</h3><span class="status wait">With specialist reviewers</span></div><p>' + esc(r.text) + "</p></div>").join("") + "</div></div>";
    $("work").innerHTML = h;
    hood("Each provision keeps its source, modality and applicability conditions. Reports correct GovBridge's representation; the law or standard itself is unchanged.", [block("Provision record (OWL)", pv.ttl)]);
  }
  function rDecisions() {
    const ds = S.store.decisions;
    let h = head("Record", "Decisions and releases", "Every decision is published with its tally, reasons and effect. Releases list what changed in GovBridge-O.", ["Public record", "tier-none"]) + "</div>";
    h += '<div class="panel"><div class="eyebrow">Releases</div><div class="rows" style="margin-top:10px">' + (published() ? '<div class="arow"><div class="top"><h3>GovBridge-O 0.4</h3><span class="status new">Current</span></div><p>Adds GB-R-007 Bias testing before deployment (EU AI Act Art. 10(2)(f)), proposed by Demo University.</p></div>' : "") +
      '<div class="arow"><div class="top"><h3>GovBridge-O 0.3</h3>' + (published() ? '<span class="status na">Previous</span>' : '<span class="status new">Current</span>') + "</div><p>Six harmonised requirements from 17 provisions in four instruments.</p></div></div></div>";
    h += '<div class="panel"><div class="eyebrow">Decisions</div>' + (ds.length ? '<div class="rows" style="margin-top:10px">' + ds.map((d) => '<div class="arow"><div class="top"><h3><span class="id">' + d.pid + "</span> " + esc(d.title) + '</h3><span class="status ' + (d.outcome === "Approved" ? "ok" : "bad") + '">' + d.outcome + "</span></div><p>" + esc(d.tally) + " · " + esc(d.date) + "</p><p>" + esc(d.effect) + '</p><p style="color:var(--faint)">Your reason: ' + esc(d.reason) + "</p></div>").join("") + "</div>" : '<p class="lead" style="margin-top:8px">No decisions yet. Vote in the Voting queue.</p>') + "</div>";
    $("work").innerHTML = h;
    const d = ds[0];
    hood("Decision records are linked to the proposal and to the release they change, so anyone can trace why a requirement exists.", [block("Latest decision record (Turtle)", d ? PREFIX + "\n@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .\n\ngbo:Decision-" + d.pid + " a gbo:AssemblyDecision ;\n    gbo:concerns gbo:" + d.pid + " ;\n    gbo:outcome gbo:" + d.outcome.replace(" ", "") + ' ;\n    gbo:tally "' + d.tally + '" ;\n    gbo:decidedOn "' + d.date + '"^^xsd:date ;\n    gbo:reason "' + d.reason.replace(/"/g, "'") + '" .\n' : "# no decisions yet")]);
  }

  // =====================================================================  EVENTS
  document.addEventListener("click", (e) => {
    const t = e.target;
    const cp = t.closest("[data-copy]");
    if (cp) { const src = codeStore[cp.dataset.copy]; const done = () => { cp.textContent = "Copied"; setTimeout(() => (cp.textContent = "Copy"), 1400); }; try { navigator.clipboard.writeText(src).then(done, () => selectCode(cp.dataset.copy)); } catch (err) { selectCode(cp.dataset.copy); } return; }
    const g = t.closest("[data-go]"); if (g) return go(g.dataset.go);
    if (t.closest("[data-logout]")) { S.name = ""; S.role = null; S.tab = null; return go("landing"); }
    if (t.closest("[data-reset]")) { S.store = SEED(); S.vote = { pid: "P-008", choice: "", reason: "", coi: false }; S.report = ""; save(); return render(); }
    const rl = t.closest("[data-role]"); if (rl) { S.role = rl.dataset.role; S.tab = null; S.sel = "GB-R-001"; return go("app"); }
    if (t.closest("#hood-toggle")) { S.hood = !S.hood; return render(); }
    const tb = t.closest("[data-tab]"); if (tb) { S.tab = tb.dataset.tab; render(); return window.scrollTo({ top: 0 }); }
    const gt = t.closest("[data-goto]"); if (gt) { S.sel = gt.dataset.r; S.tab = gt.dataset.goto; render(); return window.scrollTo({ top: 0 }); }
    const sg = t.closest("[data-seg]"); if (sg) { S.p[sg.dataset.seg] = sg.dataset.v; return render(); }
    const pf = t.closest("[data-pf]"); if (pf) { S.form[pf.dataset.pf] = +pf.dataset.v; return render(); }
    const ef = t.closest("[data-ef]"); if (ef) { S.evalForm[ef.dataset.ef] = ef.dataset.ef === "rid" ? ef.dataset.v : +ef.dataset.v; return render(); }
    const vt = t.closest("[data-vt]"); if (vt) { S.vote.choice = vt.dataset.v; return render(); }
    const pk = t.closest("[data-pick]"); if (pk) { S.sel = pk.dataset.pick; return render(); }
    const rc = t.closest("[data-rec]"); if (rc) { S.recSel = rc.dataset.rec; return render(); }
    if (t.closest("#pf-submit")) { submitProposal(); S.tab = "mine"; render(); return window.scrollTo({ top: 0 }); }
    if (t.closest("#ef-submit")) { S.store.evaluations.unshift(Object.assign({ date: TODAY }, S.evalForm)); save(); return render(); }
    if (t.closest("#v-cast")) { castVote(); S.tab = "decisions"; render(); return window.scrollTo({ top: 0 }); }
    if (t.closest("#rep-submit")) { const pv = D.provisions[S.recSel]; S.store.reports.unshift({ pid: S.recSel, ref: INST_SHORT[pv.instrument] + " " + pv.ref, text: S.report.trim() }); S.report = ""; save(); return render(); }
    if (t.closest("input, label, button, a, summary, textarea")) return;
    const pr = t.closest("[data-prop]"); if (pr && pr.dataset.prop !== S.vote.pid) { S.vote = { pid: pr.dataset.prop, choice: "", reason: "", coi: false }; return render(); }
    const rq = t.closest("[data-req]"); if (rq && rq.dataset.req !== S.sel) { S.sel = rq.dataset.req; render(); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.spec) { S.spec[t.dataset.spec] = t.checked; S.sel = Object.keys(D.spec.features).find((r) => D.spec.features[r].some(([f]) => f === t.dataset.spec)); render(); $("spec-" + t.dataset.spec)?.focus(); }
    if (t.dataset.ev) { const r = t.dataset.ev, i = +t.dataset.i, b = S.ev[r].split(""); b[i] = t.checked ? "1" : "0"; S.ev[r] = b.join(""); S.sel = r; S.fp = ""; render(); $("ev-" + r + "-" + i)?.focus(); }
    if (t.id === "v-coi") { S.vote.coi = t.checked; render(); $("v-coi")?.focus(); }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "pf-title") S.form.title = t.value;
    if (t.id === "pf-stmt") S.form.statement = t.value;
    if (t.id === "ef-text") S.evalForm.text = t.value;
    if (t.id === "v-reason") { S.vote.reason = t.value; const b = $("v-cast"); if (b) b.disabled = !(S.vote.coi && S.vote.choice && t.value.trim().length >= 8); }
    if (t.id === "rep-text") { S.report = t.value; const b = $("rep-submit"); if (b) b.disabled = t.value.trim().length < 8; }
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "login-form") return;
    e.preventDefault();
    const u = $("login-user").value.trim(); $("login-pass").value = "";
    S.name = u ? (u.includes("@") ? u.split("@")[0] : u).replace(/[._-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()) : "Guest";
    go("role");
  });
  // direct links for presenters: #login, #roles, #user, #proposer, #policymaker
  const h0 = location.hash.slice(1);
  if (h0 === "login") S.screen = "login";
  else if (h0 === "roles") { S.name = "Guest"; S.screen = "role"; }
  else if (ROLES[h0]) { S.name = "Guest"; S.role = h0; S.screen = "app"; }
  render();
})();
</script>
</body></html>
